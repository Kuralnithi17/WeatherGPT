services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weathergpt
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt_dev
    ports:
      - "5432:5432"
    volumes:
      - weathergpt-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathergpt -d weathergpt"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  weathergpt-postgres: